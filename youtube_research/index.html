<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画リサーチ</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --accent-text:#fff; --hot:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#181c25; --text:#e8ebf2; --muted:#98a2b3; --line:#2a303c; --accent:#3b82f6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:9px 18px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-text); font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-top:12px; }
  .hint { color:var(--muted); font-size:12px; }
  .error { color:var(--hot); white-space:pre-wrap; margin-top:12px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .tile .v { font-size:22px; font-weight:700; }
  .tile .k { font-size:12px; color:var(--muted); }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:860px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  th { font-size:12px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; }
  th.left, td.left { text-align:left; }
  td.title { max-width:340px; }
  td img { width:96px; height:54px; object-fit:cover; border-radius:4px; display:block; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .hot { color:var(--hot); font-weight:700; }
  .inline { display:flex; align-items:center; gap:6px; }
  .inline input { width:auto; }
  [hidden] { display:none !important; }
  h2 { font-size:18px; margin:12px 0 4px; overflow-wrap:anywhere; }
  .linkish { background:none; border:0; padding:0; color:var(--accent); font:inherit; font-weight:400; text-align:left; cursor:pointer; }
  .linkish:hover { text-decoration:underline; }
  .ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  #chart svg { width:100%; height:auto; display:block; }
  .toplist { margin:0; padding-left:22px; display:grid; gap:6px; }
  .toplist li { overflow-wrap:anywhere; }
  .toplist .meta { color:var(--muted); font-size:12px; margin-left:6px; white-space:nowrap; }
  @media (max-width: 700px) {
    table { min-width:0; }
    thead { display:none; }
    tbody tr { display:grid; grid-template-columns:96px 1fr; column-gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
    tbody td { border:0; padding:2px 0; text-align:left; }
    td.thumb { grid-row:1 / 3; grid-column:1; }
    td.title { grid-column:2; max-width:none; overflow-wrap:anywhere; }
    td.channel { grid-column:2; font-size:12px; }
    td[data-label]:not(.thumb):not(.title):not(.channel) { grid-column:1 / -1; display:flex; justify-content:space-between; }
    td[data-label]:not(.thumb):not(.title):not(.channel)::before { content:attr(data-label); color:var(--muted); font-size:12px; }
    td.thumb:empty { display:none; }
  }
</style>
</head>
<body>
<main>
  <h1>動画リサーチ</h1>

  <form id="form" class="card">
    <div class="grid">
      <div><label for="key">YouTube Data API キー</label>
        <input id="keyUser" name="username" type="text" value="youtube-api-key" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <input id="key" name="password" type="password" autocomplete="current-password" placeholder="AIza..." required></div>
      <div><label for="query">キーワード</label><input id="query" type="text" required></div>
      <div><label for="days">投稿日(過去◯日)</label>
        <select id="days"><option value="7">過去7日</option><option value="30" selected>過去30日</option><option value="90">過去90日</option><option value="365">過去1年</option></select></div>
      <div><label for="maxSeconds">動画の長さ</label>
        <select id="maxSeconds"><option value="60" selected>60秒以内</option><option value="180">3分以内</option></select></div>
      <div><label for="order">並び順(検索時)</label>
        <select id="order"><option value="viewCount" selected>再生回数順</option><option value="date">新着順</option><option value="relevance">関連度順</option></select></div>
      <div><label for="perChannelLimit">1チャンネルの上限</label><input id="perChannelLimit" type="number" min="1" max="50" value="20"></div>
      <div><label for="targetCount">取得動画数</label>
        <select id="targetCount"><option value="50">50本</option><option value="100">100本</option><option value="200" selected>200本</option></select></div>
    </div>
    <div class="row">
      <button id="go" type="submit">最新データを取得</button>
      <span class="hint" id="quotaHint">1回の取得で API 利用枠(1日1万)を約100〜1,000消費します。</span>
    </div>
    <div class="bar" id="bar" hidden><div id="barFill"></div></div>
    <div class="hint" id="status"></div>
    <div class="error" id="error" role="alert"></div>
  </form>

  <section id="results" hidden>
    <div class="card"><div class="tiles" id="tiles"></div></div>
    <div class="card">
      <div class="row" style="margin-top:0">
        <div style="width:170px"><label for="threshold">再生倍率のしきい値</label><input id="threshold" type="number" min="0" step="0.5" value="10"></div>
        <label class="inline" style="margin-bottom:9px"><input id="onlyHot" type="checkbox"> しきい値以上のみ表示</label>
        <div style="width:200px"><label for="sortSel">並べ替え</label>
          <select id="sortSel">
            <option value="multiplier:desc">再生倍率が高い順</option>
            <option value="views:desc">再生回数が多い順</option>
            <option value="likeRatio:desc">いいね/再生が高い順</option>
            <option value="publishedAt:desc">投稿日が新しい順</option>
            <option value="subscribers:asc">登録者が少ない順</option>
          </select></div>
        <span class="hint" style="margin-bottom:9px">再生倍率 = 再生回数 ÷ チャンネル登録者数。</span>
      </div>
      <div class="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section id="detail" hidden>
    <div class="card">
      <div class="row" style="margin-top:0">
        <button id="back" class="ghost" type="button">← 一覧へ戻る</button>
        <a id="ytLink" href="#" target="_blank" rel="noopener noreferrer">YouTube で開く</a>
      </div>
      <h2 id="chTitle"></h2>
      <div class="hint" id="chStatus"></div>
      <div class="error" id="chError" role="alert"></div>
      <div class="tiles" id="chTiles"></div>
    </div>
    <div class="card" id="chartCard" hidden>
      <h3 style="margin:0 0 4px;font-size:15px">投稿日別の再生数</h3>
      <div class="hint" id="chartNote"></div>
      <div id="chart"></div>
    </div>
    <div class="card" id="topCard" hidden>
      <h3 style="margin:0 0 8px;font-size:15px">再生数の多い動画</h3>
      <ol id="topList" class="toplist"></ol>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
