<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>車関係 オーバーレイ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 実測値ベース（車関係_参考動画分析_01_Paradoxia.md） =====
     フレーム 720x1280 / 背景 #050505 / アクセント #C69A4C
     クリップ窓 x41 y284 638x361 (16:9) / 中央縦罫 x360
     スペック行区切り y812,864,916,968 (ピッチ52) / 価格ボックス x42 y1066 636x174 */
  :root{
    --gold:#C69A4C;
    --bg:#050505;
    --line:#2A2A2A;
    --label:#8A8A8A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#222;margin:0;padding:0;}

  /* 透過書き出し用: body に class="transparent" を付けるとクリップ窓が抜ける */
  #frame{
    position:relative;width:720px;height:1280px;background:var(--bg);
    font-family:"Noto Sans JP",sans-serif;color:#fff;overflow:hidden;
  }

  /* --- ヘッダー y26-73 --- */
  #header{position:absolute;left:40px;top:26px;height:48px;display:flex;align-items:center;gap:12px;}
  #avatar{width:44px;height:44px;border-radius:50%;background:#EDEAE4;color:#111;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:.02em;}
  #handle .name{font-size:19px;font-weight:700;line-height:1.15;}
  #handle .id{font-size:13px;font-weight:400;color:#9A9A9A;line-height:1.2;}

  /* --- 見出し y123-211 行送り51px --- */
  #headline{position:absolute;left:40px;top:118px;font-size:34px;font-weight:700;line-height:51px;letter-spacing:.01em;}
  #headline .g{color:var(--gold);}

  /* --- クリップ窓 x41 y284 638x361 --- */
  #clip{position:absolute;left:41px;top:284px;width:638px;height:361px;border-radius:8px;overflow:hidden;background:#000;}
  body.transparent #clip{background:transparent;}
  #clip video,#clip img{width:100%;height:100%;object-fit:cover;display:block;}

  /* --- スペック表 --- */
  #specs{position:absolute;left:0;top:660px;width:720px;height:380px;}
  #vrule{position:absolute;left:360px;top:0;width:1px;height:380px;background:var(--line);}
  .col{position:absolute;top:0;width:330px;}
  .col.left{left:20px;}  .col.right{left:370px;}
  .carname{text-align:center;font-size:17px;font-weight:700;letter-spacing:.03em;padding-top:12px;}
  .carname u{text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:2px;}
  .power{text-align:center;margin-top:18px;}
  .power .n{font-size:40px;font-weight:700;color:var(--gold);letter-spacing:-.01em;}
  .power .u{font-size:17px;font-weight:700;margin-left:2px;}
  .rows{margin-top:12px;padding:0 10px;}
  .row{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .row .ico{width:22px;height:22px;flex:0 0 22px;opacity:.85;}
  .row .txt .l{font-size:11px;color:var(--label);line-height:1.3;}
  .row .txt .v{font-size:14px;font-weight:500;line-height:1.35;}

  /* --- 価格ボックス x42 y1066 636x174 --- */
  #price{position:absolute;left:42px;top:1066px;width:636px;height:174px;border:1px solid var(--line);}
  #price .cap{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg);
    padding:0 14px;font-size:12px;font-weight:700;letter-spacing:.18em;}
  #price .pvrule{position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--line);}
  #price .pcol{position:absolute;top:40px;width:50%;text-align:center;}
  #price .pcol.l{left:0;} #price .pcol.r{left:50%;}
  #price .pname{font-size:14px;font-weight:700;letter-spacing:.02em;}
  #price .pval{margin-top:14px;font-size:22px;font-weight:700;color:var(--gold);}
  #price .pnote{margin-top:8px;font-size:10px;color:var(--label);}
</style>
</head>
<body>
<div id="frame">

  <div id="header">
    <div id="avatar">Paradoxia</div>
    <div id="handle">
      <div class="name" data-f="accountName">Paradoxia</div>
      <div class="id" data-f="accountId">@paradoxia.cars</div>
    </div>
  </div>

  <div id="headline" data-f="headline">
    <span class="g">600馬力</span>のGRヤリスが<br>
    <span class="g">812</span>に挑む。
  </div>

  <div id="clip"><!-- 編集ソフトでクリップを重ねる。透過書き出し時はここが抜ける --></div>

  <div id="specs">
    <div id="vrule"></div>

    <div class="col left">
      <div class="carname">TOYOTA <u>GR</u> YARIS</div>
      <div class="power"><span class="n">約600</span><span class="u">HP</span></div>
      <div class="rows">
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><rect x="4" y="9" width="11" height="8" rx="1"/><path d="M15 12h4v5h-4M7 9V6h4v3"/></svg>
          <div class="txt"><div class="l">エンジン</div><div class="v">1.6L 3-CYL TURBO</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><path d="M18 8a7 7 0 1 0 2 5"/><path d="M20 7v6h-5"/></svg>
          <div class="txt"><div class="l">最大トルク</div><div class="v">約630 Nm</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><path d="M4 8h16M12 8v10M7 18h10"/><path d="M8 8V6h8v2"/></svg>
          <div class="txt"><div class="l">車重</div><div class="v">約1,280 kg</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/><circle cx="12" cy="12" r="1.6"/></svg>
          <div class="txt"><div class="l">駆動方式</div><div class="v">AWD</div></div></div>
      </div>
    </div>

    <div class="col right">
      <div class="carname">FERRARI <u>812</u> SUPERFAST</div>
      <div class="power"><span class="n">800</span><span class="u">HP</span></div>
      <div class="rows">
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><rect x="4" y="9" width="11" height="8" rx="1"/><path d="M15 12h4v5h-4M7 9V6h4v3"/></svg>
          <div class="txt"><div class="l">エンジン</div><div class="v">6.5L V12 N/A</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><path d="M18 8a7 7 0 1 0 2 5"/><path d="M20 7v6h-5"/></svg>
          <div class="txt"><div class="l">最大トルク</div><div class="v">718 Nm</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><path d="M4 8h16M12 8v10M7 18h10"/><path d="M8 8V6h8v2"/></svg>
          <div class="txt"><div class="l">車重</div><div class="v">約1,630 kg</div></div></div>
        <div class="row"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/><circle cx="12" cy="12" r="1.6"/></svg>
          <div class="txt"><div class="l">駆動方式</div><div class="v">RWD</div></div></div>
      </div>
    </div>
  </div>

  <div id="price">
    <div class="cap">PRICE</div>
    <div class="pvrule"></div>
    <div class="pcol l">
      <div class="pname">GR YARIS</div>
      <div class="pval">約2,500万円</div>
      <div class="pnote">※カスタム費用込み</div>
    </div>
    <div class="pcol r">
      <div class="pname">FERRARI 812 SUPERFAST</div>
      <div class="pval">新車時 約5,100万円</div>
    </div>
  </div>

</div>
</body>
</html>
